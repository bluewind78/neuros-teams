<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>BOD Prediction – Pyodide</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.25.1/full/pyodide.js"></script>
</head>
<body>
  <h1>BOD Predictor (client‑side)</h1>
  <label>Flow (m³ d⁻¹)
    <input id="flow" type="number" step="any" value="30000">
  </label>
  <label>Temperature (°C)
    <input id="temp" type="number" step="any" value="20">
  </label>
  <button id="go">Predict</button>
  <pre id="out"></pre>

<script>
async function start() {
  const pyodide = await loadPyodide();
  // Load numpy (and any other libs you need)
  await pyodide.loadPackage(['numpy']);

  // Copy the core_model logic into pyodide
  const code = `
import numpy as np

def arrhenius_rate(T_c, k_ref=0.90, Ea=75.0, Tref=20.0):
    R = 8.314
    T_k = T_c + 273.15
    Tref_k = Tref + 273.15
    return k_ref * np.exp((Ea*1000.0/R)*(1.0/Tref_k-1.0/T_k))

def monod_rate(T_c, MLSS=2500.0, S_in=300.0, DO_set=2.5, Ks=15.0, K_O=0.3):
    kT = arrhenius_rate(T_c)
    return kT * MLSS * (S_in/(Ks+S_in)) * (DO_set/(K_O+DO_set))

def effluent_bod(T_c, Q=30000.0, V_aer=75000.0):
    r = monod_rate(T_c)
    return 300.0 - r * V_aer / Q

def air_flow_needed(T_c, Q=30000.0, V_aer=75000.0, OTE=4.5):
    r = monod_rate(T_c)
    O2_demand = r * V_aer
    air_d_per_d = O2_demand / OTE
    return air_d_per_d / 86400.0
  `;
  await pyodide.runPythonAsync(code);

  document.getElementById('go').onclick = async () => {
    const flow = parseFloat(document.getElementById('flow').value);
    const temp = parseFloat(document.getElementById('temp').value);
    const bod = pyodide.globals.get('effluent_bod')(temp, Q=flow);
    const air = pyodide.globals.get('air_flow_needed')(temp, Q=flow);
    document.getElementById('out').textContent =
      `Effluent BOD = ${bod.toFixed(1)} mg L⁻¹\nAir flow = ${air.toFixed(3)} m³ s⁻¹`;
  };
}
start();
</script>
</body>
</html>
